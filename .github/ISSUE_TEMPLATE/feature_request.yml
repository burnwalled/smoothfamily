name: A wish
description: Something the family would like Smooth Family to do.
labels: ["enhancement"]
body:
  - type: textarea
    id: wish
    attributes:
      label: What would you like to be able to do?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why would it help your family?
  - type: textarea
    id: how
    attributes:
      label: How do you do it today?
