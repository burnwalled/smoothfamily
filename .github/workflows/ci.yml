name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    name: Backend (FastAPI)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: boet
          POSTGRES_PASSWORD: boet
          POSTGRES_DB: boet_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy app
        continue-on-error: true # remove once strict mypy passes

      - name: Tests
        run: uv run pytest
        env:
          DATABASE_URL: postgresql+asyncpg://boet:boet@localhost:5432/boet_test
          CLERK_SECRET_KEY: sk_test_dummy
          CLERK_PUBLISHABLE_KEY: pk_test_dummy
          CLERK_WEBHOOK_SECRET: whsec_dummy
          CLERK_JWT_ISSUER: https://example.clerk.accounts.dev
          STRIPE_SECRET_KEY: sk_test_dummy
          STRIPE_WEBHOOK_SECRET: whsec_dummy
          STRIPE_PRICE_STANDARD_MONTHLY: price_dummy
          STRIPE_PRICE_STANDARD_YEARLY: price_dummy
          STRIPE_PRICE_PREMIUM_MONTHLY: price_dummy
          STRIPE_PRICE_PREMIUM_YEARLY: price_dummy
          RESEND_API_KEY: re_dummy
          FIELD_ENCRYPTION_KEY: gAAAAABm__________________________________=

  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm type-check

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_dummy
          CLERK_SECRET_KEY: sk_test_dummy
          NEXT_PUBLIC_API_URL: http://localhost:8000
          NEXT_PUBLIC_APP_URL: http://localhost:3000
